name: Upstream Sync

permissions:
  contents: read

# 2026-11-05 上游合并（merge/upstream-20261105）后按 R-SYNC-02 改造：
# 移除每日 schedule，仅保留手动触发；禁止 reset --hard / force-with-lease / 直推 main。
# 本 workflow 只读对比上游差异并输出报告，不写入任何分支。
# 如需恢复自动同步，按 R-SYNC-03 另立需求：创建 PR 并通过全部 Gate，不得直接写 main。
on:
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Compare upstream changes (read-only, no push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Compare upstream changes
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          echo "== main...upstream/main (left=local ahead, right=upstream ahead) =="
          git rev-list --left-right --count main...upstream/main

          if git diff --quiet HEAD upstream/main; then
            echo "内容与上游一致，无需同步。"
          else
            echo "检测到上游差异。请人工创建候选分支执行 merge 并走完整 Gate 验证，禁止自动直推 main。"
            git diff --stat HEAD upstream/main
          fi